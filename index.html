<!DOCTYPE html>
<html lang="es">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 5</title>
    <style>
       
        .elemento{
            width: 300px;
            height: 300px;
        }
 
        
        .nubes{
            position: fixed;
            z-index: 100;
            margin-top: -320px;
        }
        .nube2{
            height: 120px;
        }
        .nube1{
            height: 100px;
            margin-right: auto;
            margin-left: 255px;
        }
        .logo{
            position: absolute;
            margin-top: -100px;
            margin-left: 100px;
            z-index: 99;
            height: 200px;
            
        }
 
 
        .navbar {
            padding: 20px;
            width: 800px;
            position: sticky;
            top: 0;
            overflow: hidden;
            background: linear-gradient(90deg,#7dff86 0%, #64fda8 50%, #05dcb7 100%);
            text-align: center;
            z-index: 99;
        }
 
        a{
            color: #0f4054;
            padding: 14px;
            font-size: 24px;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }
 
        footer {
            height: 450px;
            width: 800px;
            background-color: rgb(194, 122, 29);
            margin: 10px;
        }
 
        #final {
            height: 900px;
            width: 800px;
            background-color: rgb(206, 15, 15);
            margin: 10px;
        }
 
 
    .roja {
        width: 810px;
      height: 320px;
      position: absolute;
      background-color: #05dcb7;
      top: 0px;
      left: 8px;
      z-index: 0;
    }
 
   
     .footer {
            width: 800px;
            background-color: #0d3446;
            color: #ffffff;
            padding: 40px 20px;
            font-family: "Roboto", sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            box-sizing: border-box;
        }
        .footer-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            margin-bottom: 10px;
        }
        .footer-logos img {
            height: 60px;
            width: auto;
            display: block;
        }
        .footer-title-img {
            width: 100%;       
            max-width: 190px;  
            height: auto;      
            display: block;    
            margin: 10px 0;    
        }
        .footer-links {
            list-style: none;
            padding: 0;
            margin: 10px 0 0 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 14px;
        }
        .footer-links li {
            display: flex;
            align-items: center;
        }
        .footer-links a {
            color: #ffffff;
            text-decoration: none;
        }
        .separator {
            color: #a4c4d4;
            margin: 0 5px;
        }
        .footer-copyright {
            font-size: 13px;
            margin-top: 5px;
            opacity: 0.9;
        }
    </style>
</head>
 
<body>
    <div class="elemento"></div>
 

    <div class="nubes">
        <img class="nube2" src="img/nube2.png">
        <img class="nube1" src="img/nube1.png">
    </div>

    <div class="logo">
        <img class="logo" src="img/Logo a color.png">
    </div>

    </div>
 
    <div class="navbar">
        <a href="">Inicio</a>
        <a href="">Descargas</a>
        <a href="#final">Final</a>
    </div>
 
    <div class="roja"></div>
    
    <footer class="footer">
        <div class="footer-logos">
            <img src="img/logo-happy.webp" alt="Happy Elements">
            <img src="img/logo-cacalia.webp" alt="Cacalia Studio">
        </div>
        <img src="img/ensemble.png" alt="ENSEMBLE STARS!! Music" class="footer-title-img">
        <ul class="footer-links">
            <li><a href="#">Privacy Policy</a>
                <span class="separator">|</span></li>
            <li><a href="#">Terms of Service</a>
                <span class="separator">|</span></li>
            <li><a href="#">About Us</a>
                <span class="separator">|</span></li>
            <li><a href="#">Contact Us</a>
                <span class="separator">|</span></li>
            <li><a href="#">IP Terms</a></li>
        </ul>
        <div class="footer-copyright">
            Copyright Happy Elements. Todos los derechos reservados.
        </div>
    </footer>
    <footer id="final"></footer>
</body>
 
</html>
